configuration:
  bell_sound:
    name: Beep
    description: >-
      Where EBaC beeps (nowhere to go, as at Genesis 1:1, or no room for
      another key), play a short beep. Turn it off if it would disturb
      someone, such as someone asleep nearby.
  bell_flash:
    name: Flash the screen
    description: >-
      Where EBaC beeps, turn the screen white for a moment (0.15 seconds).
      Turn it off if flashing could be harmful, such as for someone with
      photosensitive epilepsy.
  bell_vibrate:
    name: Vibrate
    description: >-
      Where EBaC beeps, buzz briefly, on a phone that can (Android; an
      iPhone doesn't let a page vibrate).
  allow_add:
    name: Allow voice to add translations
    description: >-
      Lets the EBaC integration (Assist) download and add translations.
      The integration has its own checkbox too; both must be on.
  allow_remove:
    name: Allow voice to remove translations
    description: >-
      Lets the EBaC integration (Assist) remove translations you added.
      Needs "Allow voice to add translations" on too: on its own it does
      nothing (this page can't stop you checking it alone). Risk: someone speaking to a voice
      assistant, with no password, could delete a translation you paid
      for, such as the NIV. The integration has its own checkbox too.
  debug_overlay:
    name: Troubleshooting box
    description: >-
      Shows a box in the corner of EBaC's page listing what it sees of the
      keyboard focus and the window's size, to help find problems on a
      particular phone. Leave it off normally.
